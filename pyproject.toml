[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kisansathi"
version = "0.1.0"
description = "A multilingual assistant foundation for farmers"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PyMuPDF==1.26.4",
    "httpx==0.28.1",
    "langgraph==1.2.12",
    "qdrant-client==1.19.1",
    "sentence-transformers==6.1.0",
    "torchvision>=0.15,<0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.14,<0.15",
]
ui = [
    "streamlit>=1.65.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]